<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="CineTray: a video card flies into a dock of playlist wells">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101119"/>
      <stop offset="1" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3350"/>
      <stop offset="1" stop-color="#181b2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <style>
    .wordmark { font: 600 58px 'Segoe UI', Arial, sans-serif; fill: #f4f5f9; }
    .tagline { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #8f95ab; }
    .kicker  { font: 600 12px 'Segoe UI', Arial, sans-serif; letter-spacing: 3px; fill: #ff4d6d; }
    .count   { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #f4f5f9; }
    .well-name { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #c7cada; }
    .shadow { fill: #000; opacity: 0.45; filter: url(#soft); }

    #mover   { animation: fly 7.5s cubic-bezier(.45,.05,.3,1) infinite; }
    #tilt    { animation: tilt 7.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    #mover .mshadow { animation: shadow 7.5s ease-in-out infinite; }
    #cursor  { animation: cursor 7.5s cubic-bezier(.45,.05,.3,1) infinite; }
    .trail   { opacity: 0; }
    .t1 { animation: trail1 7.5s cubic-bezier(.45,.05,.3,1) infinite; }
    .t2 { animation: trail2 7.5s cubic-bezier(.45,.05,.3,1) infinite; }
    #track   { animation: track 7.5s ease-in-out infinite; }
    #wlwell  { animation: well 7.5s ease-in-out infinite; }
    #wlring  { animation: ring 7.5s ease-in-out infinite; }
    #countA  { animation: countA 7.5s steps(1) infinite; }
    #countB  { animation: countB 7.5s steps(1) infinite; }
    .spark   { transform-box: fill-box; transform-origin: center; opacity: 0; animation: spark 7.5s ease-out infinite; }

    @keyframes fly {
      0%, 9%   { transform: translate(0px, 0px); }
      14%      { transform: translate(-10px, -14px); }
      40%      { transform: translate(255px, -60px); }
      46%      { transform: translate(372px, -6px) scale(0.55); }
      50%, 90% { transform: translate(372px, -6px) scale(0.2); opacity: 0; }
      90.1%    { transform: translate(0px, 0px) scale(1); opacity: 0; }
      96%,100% { transform: translate(0px, 0px) scale(1); opacity: 1; }
    }
    @keyframes tilt {
      0%, 9%   { transform: rotate(0deg); }
      14%      { transform: rotate(-3deg); }
      27%      { transform: rotate(-7deg); }
      40%      { transform: rotate(4deg); }
      46%,100% { transform: rotate(0deg); }
    }
    @keyframes shadow {
      0%, 9%   { opacity: 0.45; }
      27%      { opacity: 0.18; }
      46%,100% { opacity: 0.05; }
    }
    @keyframes cursor {
      0%, 9%   { transform: translate(0px, 0px); opacity: 1; }
      14%      { transform: translate(-10px, -14px); }
      42%      { transform: translate(358px, -22px); opacity: 1; }
      48%, 88% { transform: translate(372px, -6px); opacity: 0; }
      94%,100% { transform: translate(0px, 0px); opacity: 1; }
    }
    @keyframes trail1 {
      0%, 16% { opacity: 0; transform: translate(0px, 0px); }
      30%     { opacity: 0.35; transform: translate(90px, -22px); }
      40%     { opacity: 0.12; transform: translate(190px, -45px); }
      46%,100%{ opacity: 0; transform: translate(255px, -60px); }
    }
    @keyframes trail2 {
      0%, 18% { opacity: 0; transform: translate(0px, 0px); }
      33%     { opacity: 0.2; transform: translate(60px, -14px); }
      44%,100%{ opacity: 0; transform: translate(160px, -36px); }
    }
    @keyframes track {
      0%, 12% { stroke-dashoffset: 0; opacity: 0.25; }
      46%     { opacity: 0.55; }
      60%,100%{ opacity: 0.25; }
    }
    @keyframes well {
      0%, 44%  { transform: scale(1); }
      50%      { transform: scale(1.08); }
      58%, 100%{ transform: scale(1); }
    }
    @keyframes ring {
      0%, 46%  { opacity: 0; }
      50%      { opacity: 0.9; }
      62%, 100%{ opacity: 0; }
    }
    @keyframes countA {
      0%, 49%  { opacity: 1; }
      50%, 96% { opacity: 0; }
      97%,100% { opacity: 1; }
    }
    @keyframes countB {
      0%, 49%  { opacity: 0; }
      50%, 92% { opacity: 1; }
      93%,100% { opacity: 0; }
    }
    @keyframes spark {
      0%, 46%  { opacity: 0; transform: translate(0,0) scale(0.4); }
      49%      { opacity: 1; transform: translate(calc(var(--dx) * 0.4), calc(var(--dy) * 0.4)) scale(1); }
      60%, 100%{ opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
    }
  </style>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <path d="M120 96 h30 a8 8 0 0 1 8 8 v52 a8 8 0 0 1 -8 8 h-30 a8 8 0 0 1 -8 -8 v-52 a8 8 0 0 1 8 -8 z M133 112 v40 l28 -20 z" fill="#ffffff" opacity="0.035"/>

  <!-- left: wordmark -->
  <text x="84" y="128" class="kicker">YOUTUBE &#183; DRAG &#183; COLLECT</text>
  <text x="80" y="186" class="wordmark">CineTray</text>
  <rect x="84" y="206" width="118" height="4" rx="2" fill="url(#accent)"/>
  <text x="84" y="246" class="tagline">Press and hold any video. Drop it on a well.</text>
  <text x="84" y="272" class="tagline">Filed to Watch Later or a playlist, in one gesture.</text>
  <circle cx="92" cy="308" r="4" fill="#ff4d6d"/>
  <text x="106" y="313" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#6d7386">runs entirely in your browser &#183; nothing leaves your machine</text>

  <!-- flight path -->
  <path id="track" d="M770 236 C 880 160, 960 150, 1120 196" fill="none" stroke="#ff4d6d" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- dock -->
  <g>
    <rect x="1116" y="60" width="124" height="248" rx="18" fill="#12141d" stroke="rgba(255,255,255,0.12)"/>
    <text x="1130" y="86" font-family="'Segoe UI', Arial, sans-serif" font-size="10" letter-spacing="2" fill="#787e92">DROP TO SAVE</text>

    <g id="wlwell" style="transform-box: fill-box; transform-origin: center;">
      <rect x="1128" y="98" width="100" height="52" rx="10" fill="rgba(255,77,109,0.16)" stroke="rgba(255,77,109,0.55)"/>
      <rect x="1136" y="106" width="34" height="22" rx="5" fill="url(#accent)" opacity="0.9"/>
      <path d="M1148 112 v10 l11 -5 z" fill="#fff"/>
      <text x="1130" y="146" class="well-name">Watch Later</text>
      <text id="countA" x="1212" y="146" class="count">2</text>
      <text id="countB" x="1212" y="146" class="count" fill="#ff8fa3">3</text>
    </g>
    <rect id="wlring" x="1124" y="94" width="108" height="60" rx="12" fill="none" stroke="#ff8fa3" stroke-width="2" opacity="0"/>

    <rect x="1128" y="160" width="100" height="46" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="1136" y="167" width="34" height="20" rx="5" fill="rgba(255,255,255,0.14)"/>
    <text x="1130" y="199" class="well-name" opacity="0.8">Deep dives</text>

    <rect x="1128" y="214" width="100" height="46" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="1136" y="221" width="34" height="20" rx="5" fill="rgba(255,255,255,0.14)"/>
    <text x="1130" y="253" class="well-name" opacity="0.8">Cooking</text>

    <rect x="1128" y="268" width="100" height="30" rx="10" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="4 4"/>
    <text x="1160" y="288" class="well-name" fill="#8f95ab">+ new</text>
  </g>

  <!-- sparkles at the well mouth -->
  <g>
    <rect class="spark" style="--dx:16px; --dy:-14px; animation-delay:0s" x="1176" y="118" width="5" height="5" rx="1.5" fill="#ff8fa3"/>
    <rect class="spark" style="--dx:-14px; --dy:-10px; animation-delay:0s" x="1176" y="122" width="4" height="4" rx="1.2" fill="#9b5cff"/>
    <rect class="spark" style="--dx:22px; --dy:6px; animation-delay:0s" x="1172" y="124" width="4" height="4" rx="1.2" fill="#ff4d6d"/>
    <rect class="spark" style="--dx:-20px; --dy:10px; animation-delay:0s" x="1180" y="120" width="3" height="3" rx="1" fill="#ffd0da"/>
    <rect class="spark" style="--dx:8px; --dy:18px; animation-delay:0s" x="1174" y="126" width="4" height="4" rx="1.2" fill="#ff8fa3"/>
    <rect class="spark" style="--dx:-8px; --dy:-18px; animation-delay:0s" x="1178" y="118" width="3" height="3" rx="1" fill="#9b5cff"/>
  </g>

  <!-- motion trails -->
  <g class="trail t1" opacity="0">
    <rect x="770" y="196" width="128" height="78" rx="9" fill="url(#accent)" opacity="0.5"/>
  </g>
  <g class="trail t2" opacity="0">
    <rect x="770" y="196" width="128" height="78" rx="9" fill="url(#accent)" opacity="0.3"/>
  </g>

  <!-- travelling card -->
  <ellipse class="mshadow" cx="834" cy="286" rx="72" ry="12" filter="url(#soft)"/>
  <g id="mover">
    <g id="tilt">
      <rect x="770" y="196" width="128" height="78" rx="9" fill="url(#thumb)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="770" y="196" width="128" height="52" rx="9" fill="url(#accent)" opacity="0.85"/>
      <path d="M824 214 v34 l26 -17 z" fill="#ffffff"/>
      <rect x="780" y="256" width="72" height="6" rx="3" fill="rgba(255,255,255,0.28)"/>
      <rect x="780" y="266" width="44" height="4" rx="2" fill="rgba(255,255,255,0.16)"/>
    </g>
  </g>

  <!-- cursor -->
  <g id="cursor">
    <path d="M910 232 l0 26 7 -6 5 12 6 -3 -5 -12 9 -1 z" fill="#fff" stroke="#0a0a10" stroke-width="1.4"/>
  </g>
</svg>
