<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Feature strip: hover chip, right-click save, tray badge, local storage">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3350"/>
      <stop offset="1" stop-color="#181b2c"/>
    </linearGradient>
  </defs>

  <style>
    .tile  { fill: #101118; stroke: rgba(255,255,255,0.08); }
    .title { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #e9eaf0; }
    .sub   { font: 400 11.5px 'Segoe UI', Arial, sans-serif; fill: #8f95ab; }

    .chip     { animation: chip 5s cubic-bezier(.3,.7,.3,1.3) infinite; transform-box: fill-box; transform-origin: center; }
    .chipbar1 { animation: chipplus1 5s ease infinite; transform-box: fill-box; transform-origin: center; }
    .chipbar2 { animation: chipplus2 5s ease infinite; transform-box: fill-box; transform-origin: center; }

    .menu    { animation: menu 6s cubic-bezier(.3,.7,.3,1) infinite; opacity: 0; }
    .menutop { animation: menuhl 6s ease infinite; }

    .badge     { animation: badgepop 6s cubic-bezier(.3,.7,.3,1.4) infinite; transform-box: fill-box; transform-origin: center; }
    .badgeone  { animation: b1 6s steps(1) infinite; }
    .badgetwo  { animation: b2 6s steps(1) infinite; }

    .pulsering { animation: pulse 3.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .dotdb     { animation: dbdot 2.2s ease-in-out infinite; }
    .dotdb2    { animation: dbdot 2.2s ease-in-out infinite; animation-delay: 0.35s; }
    .dotdb3    { animation: dbdot 2.2s ease-in-out infinite; animation-delay: 0.7s; }

    @keyframes chip {
      0%, 8%    { transform: scale(0.4); opacity: 0; }
      16%, 46%  { transform: scale(1); opacity: 1; }
      58%, 100% { transform: scale(0.4); opacity: 0; }
    }
    @keyframes chipplus1 {
      0%, 30%  { transform: rotate(0deg); }
      42%, 100%{ transform: rotate(45deg); width: 6px; }
    }
    @keyframes chipplus2 {
      0%, 30%  { transform: rotate(0deg); }
      42%, 100%{ transform: rotate(45deg); height: 10px; }
    }
    @keyframes menu {
      0%, 10%   { opacity: 0; transform: translateY(8px); }
      20%, 70%  { opacity: 1; transform: translateY(0px); }
      84%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes menuhl {
      0%, 16%  { opacity: 0; }
      24%, 70% { opacity: 1; }
      84%,100% { opacity: 0; }
    }
    @keyframes badgepop {
      0%, 12%  { transform: scale(0.3); opacity: 0; }
      20%, 55% { transform: scale(1); opacity: 1; }
      66%,100% { transform: scale(0.3); opacity: 0; }
    }
    @keyframes b1 {
      0%, 24%  { opacity: 1; }
      25%, 60% { opacity: 0; }
      61%,100% { opacity: 1; }
    }
    @keyframes b2 {
      0%, 24%  { opacity: 0; }
      25%, 60% { opacity: 1; }
      61%,100% { opacity: 0; }
    }
    @keyframes pulse {
      0%   { transform: scale(0.7); opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    @keyframes dbdot {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 1; }
    }
  </style>

  <rect width="1280" height="280" fill="#0a0a10"/>

  <!-- tile 1: hover chip -->
  <g transform="translate(32 24)">
    <rect width="288" height="200" rx="18" class="tile"/>
    <rect x="70" y="36" width="148" height="92" rx="9" fill="url(#thumb)" stroke="rgba(255,255,255,0.16)"/>
    <rect x="70" y="36" width="148" height="58" rx="9" fill="url(#accent)" opacity="0.75"/>
    <path d="M136 52 v26 l20 -13 z" fill="#fff"/>
    <g class="chip">
      <circle cx="82" cy="48" r="14" fill="rgba(12,13,18,0.8)" stroke="rgba(255,255,255,0.25)"/>
      <rect class="chipbar1" x="76" y="47" width="12" height="2.4" rx="1.2" fill="#fff"/>
      <rect class="chipbar2" x="80.8" y="42.2" width="2.4" height="12" rx="1.2" fill="#fff"/>
    </g>
    <text x="24" y="164" class="title">Hover chip</text>
    <text x="24" y="184" class="sub">one click on the card saves it to Watch Later</text>
  </g>

  <!-- tile 2: right-click -->
  <g transform="translate(352 24)">
    <rect width="288" height="200" rx="18" class="tile"/>
    <rect x="48" y="36" width="120" height="74" rx="8" fill="url(#thumb)" stroke="rgba(255,255,255,0.16)"/>
    <rect x="48" y="36" width="120" height="46" rx="8" fill="url(#accent)" opacity="0.65"/>
    <g class="menu">
      <rect x="140" y="70" width="112" height="66" rx="10" fill="#12141d" stroke="rgba(255,255,255,0.16)"/>
      <rect class="menutop" x="144" y="74" width="104" height="18" rx="6" fill="rgba(255,77,109,0.28)"/>
      <text x="152" y="87" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#e9eaf0">Save to Watch Later</text>
      <text x="152" y="107" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8f95ab">Save to playlist</text>
      <text x="152" y="126" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8f95ab">Open dashboard</text>
    </g>
    <text x="24" y="164" class="title">Right-click save</text>
    <text x="24" y="184" class="sub">any video link or thumbnail, straight from the menu</text>
  </g>

  <!-- tile 3: tray badge -->
  <g transform="translate(672 24)">
    <rect width="288" height="200" rx="18" class="tile"/>
    <g transform="translate(104 30)">
      <rect x="0" y="0" width="80" height="80" rx="18" fill="#14151f" stroke="rgba(255,255,255,0.14)"/>
      <rect x="14" y="14" width="52" height="34" rx="7" fill="#ff4d6d"/>
      <path d="M33 22 v18 l14 -9 z" fill="#fff"/>
      <rect x="14" y="56" width="52" height="7" rx="3.5" fill="#ff4d6d" opacity="0.5"/>
    </g>
    <g class="badge">
      <circle cx="184" cy="38" r="13" fill="#ff4d6d"/>
      <text class="badgeone" x="184" y="43" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
      <text class="badgetwo" x="184" y="43" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">2</text>
    </g>
    <text x="24" y="164" class="title">Tray badge</text>
    <text x="24" y="184" class="sub">the toolbar icon counts everything you have filed</text>
  </g>

  <!-- tile 4: local storage -->
  <g transform="translate(992 24)">
    <rect width="288" height="200" rx="18" class="tile"/>
    <ellipse cx="148" cy="76" rx="34" ry="10" fill="rgba(255,77,109,0.25)"/>
    <rect x="114" y="76" width="68" height="12" rx="6" fill="#ff4d6d" opacity="0.85"/>
    <rect x="114" y="92" width="68" height="12" rx="6" fill="#ff4d6d" opacity="0.55"/>
    <rect x="114" y="108" width="68" height="12" rx="6" fill="#ff4d6d" opacity="0.3"/>
    <circle class="pulsering" cx="148" cy="96" r="52" fill="none" stroke="#9b5cff" stroke-width="2"/>
    <circle class="dotdb" cx="148" cy="82" r="3" fill="#ffd0da"/>
    <circle class="dotdb2" cx="148" cy="98" r="3" fill="#ffd0da"/>
    <circle class="dotdb3" cx="148" cy="114" r="3" fill="#ffd0da"/>
    <text x="24" y="164" class="title">Local and portable</text>
    <text x="24" y="184" class="sub">chrome.storage only &#183; export or import as JSON</text>
  </g>
</svg>
