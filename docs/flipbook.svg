<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="A flipbook that turns its page through four CineTray chapters: the drag gesture, the hover chip, the dashboard, and undo feedback">
  <defs>
    <linearGradient id="fb-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="fb-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151723"/>
      <stop offset="1" stop-color="#101219"/>
    </linearGradient>
    <linearGradient id="fb-spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.12" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="fb-curl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <clipPath id="fb-right-clip">
      <rect x="604" y="86" width="432" height="372" rx="14"/>
    </clipPath>
    <filter id="fb-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <style>
    .fb-bg     { fill: #0a0a10; }
    .fb-title  { font: 600 21px 'Segoe UI', Arial, sans-serif; fill: #e9eaf0; }
    .fb-sub    { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #8f95ab; }
    .fb-chap   { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #b9bdcc; }
    .fb-chapnum{ font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #6d7386; }
    .fb-label  { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #e9eaf0; }
    .fb-dim    { font: 400 11.5px 'Segoe UI', Arial, sans-serif; fill: #8f95ab; }

    .fb-book { animation: fb-breathe 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes fb-breathe {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-7px); }
    }

    /* page turn cycle, 12s: S1 0-24 | S2 30-49 | S3 55-74 | S4 80-96 | wrap
       every page hinges at the spine (left edge of the right page):
       it arrives growing from the spine and leaves collapsing into it */
    .in1, .out1 { transform-box: fill-box; transform-origin: left; }
    .in2, .out2 { transform-box: fill-box; transform-origin: left; }
    .in3, .out3 { transform-box: fill-box; transform-origin: left; }
    .in4, .out4 { transform-box: fill-box; transform-origin: left; }
    .in1  { animation: fb-in1 12s linear infinite; }
    .out1 { animation: fb-out1 12s linear infinite; }
    .in2  { animation: fb-in2 12s linear infinite; }
    .out2 { animation: fb-out2 12s linear infinite; }
    .in3  { animation: fb-in3 12s linear infinite; }
    .out3 { animation: fb-out3 12s linear infinite; }
    .in4  { animation: fb-in4 12s linear infinite; }
    .out4 { animation: fb-out4 12s linear infinite; }

    @keyframes fb-in1  { 0% { transform: scaleX(0); } 3%, 100% { transform: scaleX(1); } }
    @keyframes fb-out1 { 0%, 21% { transform: scaleX(1); } 24%, 100% { transform: scaleX(0); } }
    @keyframes fb-in2  { 0%, 27% { transform: scaleX(0); } 30%, 100% { transform: scaleX(1); } }
    @keyframes fb-out2 { 0%, 46% { transform: scaleX(1); } 49%, 100% { transform: scaleX(0); } }
    @keyframes fb-in3  { 0%, 52% { transform: scaleX(0); } 55%, 100% { transform: scaleX(1); } }
    @keyframes fb-out3 { 0%, 71% { transform: scaleX(1); } 74%, 100% { transform: scaleX(0); } }
    @keyframes fb-in4  { 0%, 77% { transform: scaleX(0); } 80%, 100% { transform: scaleX(1); } }
    @keyframes fb-out4 { 0%, 93% { transform: scaleX(1); } 96%, 100% { transform: scaleX(0); } }

    .fb-curl { opacity: 0; animation: fb-curl 12s linear infinite; }
    @keyframes fb-curl {
      0%, 23.5% { opacity: 0; } 25.5% { opacity: 1; } 27.5% { opacity: 0; }
      48.5% { opacity: 0; } 50.5% { opacity: 1; } 52.5% { opacity: 0; }
      73.5% { opacity: 0; } 75.5% { opacity: 1; } 77.5% { opacity: 0; }
      95.5% { opacity: 0; } 97.5% { opacity: 1; } 99.5%, 100% { opacity: 0; }
    }

    .fb-marker { animation: fb-marker 12s cubic-bezier(.3,.7,.3,1) infinite; }
    @keyframes fb-marker {
      0%, 21%   { transform: translateY(0px); }
      24%, 46%  { transform: translateY(52px); }
      52%, 71%  { transform: translateY(104px); }
      77%, 93%  { transform: translateY(156px); }
      96%, 100% { transform: translateY(0px); }
    }

    .fb-wlglow { animation: fb-wlglow 12s ease-in-out infinite; }
    @keyframes fb-wlglow {
      0%, 20% { opacity: 0.25; } 25%, 27% { opacity: 0.85; } 30%, 100% { opacity: 0.25; }
    }
    .fb-chip { animation: fb-chip 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes fb-chip {
      0%, 30% { transform: scale(0.6); opacity: 0; }
      34%, 46% { transform: scale(1.1); opacity: 1; }
      50%, 100% { transform: scale(0.6); opacity: 0; }
    }
    .fb-row { animation: fb-row 12s ease-in-out infinite; }
    @keyframes fb-row {
      0%, 55% { transform: translateX(-16px); opacity: 0; }
      60%, 70% { transform: translateX(0px); opacity: 1; }
      74%, 100% { transform: translateX(-16px); opacity: 0; }
    }
    .fb-toast { animation: fb-toast 12s cubic-bezier(.3,.7,.3,1.3) infinite; }
    @keyframes fb-toast {
      0%, 80% { transform: translateY(26px); opacity: 0; }
      84%, 94% { transform: translateY(0px); opacity: 1; }
      98%, 100% { transform: translateY(26px); opacity: 0; }
    }
    .fb-badge { animation: fb-badge 12s cubic-bezier(.3,.7,.3,1.4) infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes fb-badge {
      0%, 84% { transform: scale(0.3); opacity: 0; }
      88%, 94% { transform: scale(1); opacity: 1; }
      98%, 100% { transform: scale(0.3); opacity: 0; }
    }
  </style>

  <rect class="fb-bg" width="1200" height="560"/>
  <text x="600" y="44" text-anchor="middle" class="fb-title">The CineTray flipbook</text>
  <text x="600" y="68" text-anchor="middle" class="fb-sub">four short chapters &#8212; the page turns every few seconds</text>

  <ellipse cx="600" cy="505" rx="380" ry="18" fill="#000" opacity="0.5" filter="url(#fb-blur)"/>

  <g class="fb-book">
    <!-- left page -->
    <rect x="156" y="86" width="436" height="372" rx="14" fill="url(#fb-page)" stroke="rgba(255,255,255,0.10)"/>
    <rect x="596" y="86" width="16" height="372" fill="url(#fb-spine)" opacity="0.6"/>
    <text x="188" y="128" class="fb-title" font-size="17">Chapters</text>
    <rect x="188" y="140" width="46" height="3" rx="1.5" fill="url(#fb-accent)"/>

    <g>
      <text x="206" y="186" class="fb-chapnum">01</text>
      <text x="240" y="186" class="fb-chap">The gesture</text>
      <text x="240" y="204" class="fb-dim">press, lift, drop into a well</text>
      <text x="206" y="238" class="fb-chapnum">02</text>
      <text x="240" y="238" class="fb-chap">The hover chip</text>
      <text x="240" y="256" class="fb-dim">one click, straight to Watch Later</text>
      <text x="206" y="290" class="fb-chapnum">03</text>
      <text x="240" y="290" class="fb-chap">The dashboard</text>
      <text x="240" y="308" class="fb-dim">rename, reorder, search, export</text>
      <text x="206" y="342" class="fb-chapnum">04</text>
      <text x="240" y="342" class="fb-chap">Feedback</text>
      <text x="240" y="360" class="fb-dim">sparkles, toasts, undo, badge</text>
    </g>
    <rect class="fb-marker" x="192" y="170" width="4" height="42" rx="2" fill="#ff4d6d"/>

    <text x="188" y="428" class="fb-dim">everything stays in your browser</text>

    <!-- right page -->
    <rect x="604" y="86" width="432" height="372" rx="14" fill="url(#fb-page)" stroke="rgba(255,255,255,0.10)"/>

    <g clip-path="url(#fb-right-clip)">
      <!-- S1: the gesture -->
      <g class="out1"><g class="in1">
        <g>
          <rect x="628" y="150" width="168" height="102" rx="9" fill="url(#fb-accent)" opacity="0.9"/>
          <path d="M702 186 v30 l24 -15 z" fill="#fff"/>
          <rect x="640" y="266" width="98" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
          <path d="M810 200 C 850 176, 890 176, 918 200" fill="none" stroke="#ff8fa3" stroke-width="2.5" stroke-dasharray="4 7" stroke-linecap="round"/>
          <g class="fb-wlglow">
            <rect x="902" y="186" width="112" height="52" rx="10" fill="rgba(255,77,109,0.2)" stroke="rgba(255,77,109,0.7)"/>
            <rect x="910" y="194" width="30" height="20" rx="4" fill="url(#fb-accent)" opacity="0.9"/>
            <text x="908" y="232" class="fb-dim" fill="#c9ccd8">Watch Later</text>
          </g>
          <rect x="902" y="248" width="112" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
          <text x="908" y="290" class="fb-dim" fill="#8f95ab">Deep dives</text>
          <rect x="902" y="302" width="112" height="34" rx="10" fill="none" stroke="rgba(255,255,255,0.24)" stroke-dasharray="4 4"/>
          <text x="914" y="324" class="fb-dim" fill="#8f95ab">+ new</text>
          <text x="628" y="352" class="fb-label">Drag a card onto a well &#8212; filed.</text>
          <text x="628" y="372" class="fb-dim">works on every list YouTube shows</text>
          <path d="M800 168 l0 24 6 -5 5 11 6 -3 -5 -11 8 -1 z" fill="#fff" stroke="#0a0a10" stroke-width="1.2"/>
        </g>
      </g></g>

      <!-- S2: the hover chip -->
      <g class="out2"><g class="in2">
        <g>
          <rect x="628" y="140" width="200" height="120" rx="10" fill="#181b2c" stroke="rgba(255,255,255,0.16)"/>
          <rect x="628" y="140" width="200" height="76" rx="10" fill="url(#fb-accent)" opacity="0.75"/>
          <path d="M718 162 v26 l20 -13 z" fill="#fff"/>
          <g class="fb-chip">
            <circle cx="646" cy="158" r="15" fill="rgba(12,13,18,0.85)" stroke="rgba(255,255,255,0.3)"/>
            <path d="M640 158 l4.5 4.5 8 -10" fill="none" stroke="#ff8fa3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <text x="628" y="300" class="fb-label">One click on the card.</text>
          <text x="628" y="320" class="fb-dim">the chip rides above YouTube's preview player</text>
        </g></g></g>

      <!-- S3: the dashboard -->
      <g class="out3"><g class="in3">
        <g>
          <rect x="628" y="132" width="384" height="196" rx="12" fill="#101219" stroke="rgba(255,255,255,0.10)"/>
          <circle cx="650" cy="152" r="5" fill="#ff4d6d"/>
          <text x="664" y="157" class="fb-dim" fill="#e9eaf0">Watch Later</text>
          <text x="988" y="157" class="fb-dim">4</text>
          <g class="fb-row">
            <rect x="640" y="172" width="360" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
            <rect x="648" y="178" width="52" height="28" rx="5" fill="#2e3350"/>
            <rect x="710" y="184" width="150" height="7" rx="3.5" fill="rgba(255,255,255,0.3)"/>
            <rect x="710" y="197" width="100" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
          </g>
          <rect x="640" y="220" width="360" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
          <rect x="648" y="226" width="52" height="28" rx="5" fill="#2e3350"/>
          <rect x="710" y="232" width="130" height="7" rx="3.5" fill="rgba(255,255,255,0.26)"/>
          <rect x="640" y="268" width="360" height="40" rx="8" fill="none" stroke="rgba(255,77,109,0.45)" stroke-dasharray="5 5"/>
          <text x="712" y="292" class="fb-dim" fill="#8f95ab">drag rows to reorder</text>
          <text x="628" y="372" class="fb-label">Your whole shelf, one page.</text>
          <text x="628" y="392" class="fb-dim">search everything, export any time</text>
        </g></g></g>

      <!-- S4: feedback -->
      <g class="out4"><g class="in4">
        <g>
          <g class="fb-toast">
            <rect x="640" y="200" width="220" height="44" rx="22" fill="#12141d" stroke="rgba(255,255,255,0.16)"/>
            <path d="M660 222 l6 6 11 -13" fill="none" stroke="#ff8fa3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="690" y="228" class="fb-label" font-size="13">Saved to Watch Later</text>
            <text x="830" y="228" class="fb-dim" fill="#7fb4ff">Undo</text>
          </g>
          <g class="fb-badge">
            <circle cx="920" cy="150" r="16" fill="#ff4d6d"/>
            <text x="920" y="156" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">9</text>
            <rect x="888" y="136" width="64" height="44" rx="10" fill="#14151f" stroke="rgba(255,255,255,0.16)"/>
            <rect x="897" y="144" width="46" height="26" rx="6" fill="#ff4d6d"/>
            <path d="M914 150 v12 l11 -6 z" fill="#fff"/>
          </g>
          <text x="628" y="300" class="fb-label">Every save talks back.</text>
          <text x="628" y="320" class="fb-dim">sparkles on the drop, undo in the toast, a counting badge</text>
        </g></g></g>

      <!-- curl sheen during each turn -->
      <rect class="fb-curl" x="604" y="86" width="432" height="372" fill="url(#fb-curl)"/>
    </g>

    <!-- page stack hint -->
    <rect x="610" y="458" width="424" height="4" rx="2" fill="rgba(255,255,255,0.05)"/>
    <rect x="162" y="458" width="428" height="4" rx="2" fill="rgba(255,255,255,0.05)"/>
  </g>
</svg>
