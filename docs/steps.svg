<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Four animated panels: press and hold, the card lifts, the dock slides in, drop it in">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3350"/>
      <stop offset="1" stop-color="#181b2c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <style>
    .panel  { fill: #101118; stroke: rgba(255,255,255,0.08); }
    .stepno { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #fff; }
    .steptitle { font: 600 19px 'Segoe UI', Arial, sans-serif; fill: #e9eaf0; }
    .stepsub { font: 400 12.5px 'Segoe UI', Arial, sans-serif; fill: #8f95ab; }
    .shadow { fill: #000; opacity: 0.5; filter: url(#soft); }

    /* panel 1: press */
    .press   { animation: press 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ripple1 { animation: ripple 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .ripple2 { animation: ripple 2.6s ease-out infinite; animation-delay: 1.3s; transform-box: fill-box; transform-origin: center; }

    /* panel 2: lift */
    .ghost2  { animation: bob 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .slot    { animation: slot 3.2s ease-in-out infinite alternate; }
    .sh2     { animation: sh2 3.2s ease-in-out infinite alternate; }

    /* panel 3: dock */
    .dock3   { animation: dockin 6.5s cubic-bezier(.3,.7,.3,1) infinite; }
    .w1 { animation: wellin 6.5s cubic-bezier(.3,.7,.3,1) infinite; animation-delay: 0s; opacity: 0; }
    .w2 { animation: wellin 6.5s cubic-bezier(.3,.7,.3,1) infinite; animation-delay: 0.25s; opacity: 0; }
    .w3 { animation: wellin 6.5s cubic-bezier(.3,.7,.3,1) infinite; animation-delay: 0.5s; opacity: 0; }
    .w4 { animation: wellin 6.5s cubic-bezier(.3,.7,.3,1) infinite; animation-delay: 0.75s; opacity: 0; }
    .arrow3  { animation: arrowdash 6.5s linear infinite; }

    /* panel 4: drop */
    .mcard   { animation: drop 6.5s cubic-bezier(.5,.05,.4,1) infinite; transform-box: fill-box; transform-origin: center; }
    .check   { animation: checkdraw 6.5s ease-out infinite; }
    .checkring { animation: checkring 6.5s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .spark   { transform-box: fill-box; transform-origin: center; opacity: 0; animation: spark 6.5s ease-out infinite; }

    @keyframes press {
      0%, 18%  { transform: scale(1); }
      26%      { transform: scale(0.96); }
      60%      { transform: scale(0.96); }
      72%,100% { transform: scale(1); }
    }
    @keyframes ripple {
      0%   { transform: scale(0.15); opacity: 0.65; }
      70%  { transform: scale(1.15); opacity: 0; }
      100% { transform: scale(1.15); opacity: 0; }
    }
    @keyframes bob {
      from { transform: translate(0px, -4px) rotate(-6deg); }
      to   { transform: translate(0px,  6px) rotate(-4deg); }
    }
    @keyframes slot {
      from { opacity: 0.85; }
      to   { opacity: 0.35; }
    }
    @keyframes sh2 {
      from { opacity: 0.5; rx: 26; }
      to   { opacity: 0.22; }
    }
    @keyframes dockin {
      0%, 4%   { transform: translate(150px, 0); opacity: 0; }
      16%, 78% { transform: translate(0px, 0); opacity: 1; }
      90%, 100%{ transform: translate(150px, 0); opacity: 0; }
    }
    @keyframes wellin {
      0%, 8%   { transform: translate(60px, 0); opacity: 0; }
      22%, 78% { transform: translate(0px, 0); opacity: 1; }
      90%, 100%{ transform: translate(60px, 0); opacity: 0; }
    }
    @keyframes arrowdash {
      0%, 20% { stroke-dashoffset: 24; opacity: 0; }
      30%, 70%{ stroke-dashoffset: 0; opacity: 1; }
      84%,100%{ opacity: 0; }
    }
    @keyframes drop {
      0%, 8%    { transform: translate(0px, -95px) scale(1); opacity: 0; }
      14%       { transform: translate(0px, -85px) scale(1.04); opacity: 1; }
      34%       { transform: translate(0px, 0px) scale(0.9); opacity: 1; }
      40%       { transform: translate(0px, 0px) scale(0.3); opacity: 0.9; }
      44%, 92%  { transform: translate(0px, 0px) scale(0.12); opacity: 0; }
      100%      { transform: translate(0px, -95px) scale(1); opacity: 0; }
    }
    @keyframes checkdraw {
      0%, 42%  { stroke-dashoffset: 26; }
      56%, 88% { stroke-dashoffset: 0; }
      96%,100% { stroke-dashoffset: 26; }
    }
    @keyframes checkring {
      0%, 40%  { transform: scale(0.4); opacity: 0; }
      48%      { transform: scale(1.15); opacity: 1; }
      54%      { transform: scale(1); opacity: 1; }
      88%,100% { transform: scale(1); opacity: 0; }
    }
    @keyframes spark {
      0%, 40%  { opacity: 0; transform: translate(0,0) scale(0.3); }
      45%      { opacity: 1; transform: translate(calc(var(--dx) * 0.35), calc(var(--dy) * 0.35)) scale(1); }
      58%,100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
    }
  </style>

  <rect width="1280" height="640" fill="#0a0a10"/>

  <!-- ================= panel 1 : press and hold ================= -->
  <g transform="translate(32 64)">
    <rect width="288" height="544" rx="18" class="panel"/>
    <circle cx="34" cy="44" r="16" fill="url(#accent)"/>
    <text x="34" y="49" text-anchor="middle" class="stepno">1</text>
    <text x="62" y="50" class="steptitle">Press and hold</text>
    <text x="34" y="84" class="stepsub">Rest on any card and keep the button held.</text>

    <ellipse cx="148" cy="366" rx="86" ry="14" class="shadow"/>
    <g class="press">
      <rect x="70" y="256" width="156" height="100" rx="10" fill="url(#thumb)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="70" y="256" width="156" height="64" rx="10" fill="url(#accent)" opacity="0.85"/>
      <path d="M138 276 v28 l22 -14 z" fill="#fff"/>
      <rect x="82" y="328" width="88" height="6" rx="3" fill="rgba(255,255,255,0.28)"/>
      <rect x="82" y="339" width="56" height="4" rx="2" fill="rgba(255,255,255,0.16)"/>
    </g>
    <circle class="ripple1" cx="148" cy="306" r="58" fill="none" stroke="#ff4d6d" stroke-width="2"/>
    <circle class="ripple2" cx="148" cy="306" r="58" fill="none" stroke="#9b5cff" stroke-width="2"/>
    <path d="M172 286 l0 30 8 -7 6 13 7 -3 -6 -13 10 -1 z" fill="#fff" stroke="#0a0a10" stroke-width="1.4"/>
  </g>

  <!-- ================= panel 2 : the card lifts ================= -->
  <g transform="translate(352 64)">
    <rect width="288" height="544" rx="18" class="panel"/>
    <circle cx="34" cy="44" r="16" fill="url(#accent)"/>
    <text x="34" y="49" text-anchor="middle" class="stepno">2</text>
    <text x="62" y="50" class="steptitle">The card lifts</text>
    <text x="34" y="84" class="stepsub">A ghost card springs out and follows the cursor.</text>

    <rect class="slot" x="70" y="300" width="156" height="100" rx="10" fill="none" stroke="#ff4d6d" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="148" y="416" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6d7386">its slot stays marked</text>

    <ellipse class="sh2" cx="148" cy="352" rx="80" ry="12" fill="#000" filter="url(#soft)"/>
    <g class="ghost2">
      <rect x="70" y="228" width="156" height="100" rx="10" fill="url(#thumb)" stroke="rgba(255,255,255,0.22)"/>
      <rect x="70" y="228" width="156" height="64" rx="10" fill="url(#accent)" opacity="0.9"/>
      <path d="M138 248 v28 l22 -14 z" fill="#fff"/>
      <rect x="82" y="300" width="88" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
      <rect x="82" y="311" width="56" height="4" rx="2" fill="rgba(255,255,255,0.18)"/>
    </g>
    <path d="M258 288 l0 26 7 -6 5 12 6 -3 -5 -12 9 -1 z" fill="#fff" stroke="#0a0a10" stroke-width="1.4"/>
  </g>

  <!-- ================= panel 3 : the dock slides in ================= -->
  <g transform="translate(672 64)">
    <rect width="288" height="544" rx="18" class="panel"/>
    <circle cx="34" cy="44" r="16" fill="url(#accent)"/>
    <text x="34" y="49" text-anchor="middle" class="stepno">3</text>
    <text x="62" y="50" class="steptitle">The dock slides in</text>
    <text x="34" y="84" class="stepsub">Watch Later, every playlist, plus a new one.</text>

    <g opacity="0.9">
      <rect x="34" y="250" width="96" height="60" rx="8" fill="url(#thumb)" stroke="rgba(255,255,255,0.14)"/>
      <rect x="34" y="250" width="96" height="38" rx="8" fill="url(#accent)" opacity="0.7"/>
      <path d="M74 262 v16 l13 -8 z" fill="#fff"/>
    </g>
    <path class="arrow3" d="M140 280 C 168 260, 186 252, 204 268" fill="none" stroke="#ff4d6d" stroke-width="2" stroke-dasharray="6 6"/>

    <g class="dock3">
      <rect x="188" y="150" width="84" height="330" rx="16" fill="#141623" stroke="rgba(255,255,255,0.12)"/>
      <g class="w1">
        <rect x="198" y="168" width="64" height="44" rx="8" fill="rgba(255,77,109,0.16)" stroke="rgba(255,77,109,0.55)"/>
        <rect x="204" y="174" width="24" height="16" rx="4" fill="url(#accent)" opacity="0.9"/>
        <text x="200" y="206" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#c7cada">Watch Later</text>
      </g>
      <g class="w2">
        <rect x="198" y="222" width="64" height="44" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
        <rect x="204" y="228" width="24" height="16" rx="4" fill="rgba(255,255,255,0.16)"/>
        <text x="200" y="260" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#c7cada">Deep dives</text>
      </g>
      <g class="w3">
        <rect x="198" y="276" width="64" height="44" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
        <rect x="204" y="282" width="24" height="16" rx="4" fill="rgba(255,255,255,0.16)"/>
        <text x="200" y="314" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#c7cada">Cooking</text>
      </g>
      <g class="w4">
        <rect x="198" y="330" width="64" height="34" rx="8" fill="none" stroke="rgba(255,255,255,0.22)" stroke-dasharray="4 4"/>
        <text x="210" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#8f95ab">+ new</text>
      </g>
    </g>
  </g>

  <!-- ================= panel 4 : drop it in ================= -->
  <g transform="translate(992 64)">
    <rect width="288" height="544" rx="18" class="panel"/>
    <circle cx="34" cy="44" r="16" fill="url(#accent)"/>
    <text x="34" y="49" text-anchor="middle" class="stepno">4</text>
    <text x="62" y="50" class="steptitle">Drop it in</text>
    <text x="34" y="84" class="stepsub">The card arcs in. The well swallows it.</text>

    <g class="checkring">
      <circle cx="148" cy="250" r="30" fill="rgba(255,77,109,0.14)" stroke="#ff4d6d" stroke-width="2"/>
    </g>
    <path class="check" d="M134 250 l10 10 20 -22" fill="none" stroke="#ff8fa3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="26"/>

    <g class="mcard">
      <rect x="100" y="185" width="96" height="58" rx="7" fill="url(#thumb)" stroke="rgba(255,255,255,0.2)"/>
      <rect x="100" y="185" width="96" height="37" rx="7" fill="url(#accent)" opacity="0.9"/>
      <path d="M140 197 v16 l13 -8 z" fill="#fff"/>
    </g>

    <g>
      <rect class="spark" style="--dx:18px; --dy:-12px;" x="144" y="246" width="5" height="5" rx="1.5" fill="#ff8fa3"/>
      <rect class="spark" style="--dx:-16px; --dy:-8px;" x="146" y="250" width="4" height="4" rx="1.2" fill="#9b5cff"/>
      <rect class="spark" style="--dx:22px; --dy:8px;" x="146" y="248" width="4" height="4" rx="1.2" fill="#ff4d6d"/>
      <rect class="spark" style="--dx:-18px; --dy:12px;" x="144" y="252" width="3" height="3" rx="1" fill="#ffd0da"/>
      <rect class="spark" style="--dx:6px; --dy:20px;" x="148" y="250" width="4" height="4" rx="1.2" fill="#ff8fa3"/>
      <rect class="spark" style="--dx:-6px; --dy:-18px;" x="146" y="246" width="3" height="3" rx="1" fill="#9b5cff"/>
    </g>

    <g>
      <rect x="46" y="330" width="204" height="40" rx="20" fill="#12141d" stroke="rgba(255,255,255,0.14)"/>
      <path d="M72 350 l5 5 9 -11" fill="none" stroke="#ff8fa3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="355" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e9eaf0">Saved to Watch Later</text>
      <text x="218" y="355" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7fb4ff">Undo</text>
    </g>
    <text x="148" y="420" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6d7386">nothing sent anywhere &#8212; saved to chrome.storage</text>
  </g>
</svg>
